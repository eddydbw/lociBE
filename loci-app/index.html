<!doctype html>
<html lang="en-GB">
<head>
<!--
  Loci — parent app (installable PWA), served by lociBE at /parent-app/

  This copy is wired to the live backend: live-data.js fetches
  /api/parent/<device_id> (device_id via ?device=, default "demo") and reshapes real
  captures into the same days/routes/guides shape data.js defines below, so app.js
  never knows the difference. If the fetch fails (offline, no captures yet) the
  static script in data.js is what renders — it's the fallback, not an error state.

  All copy and content lives in data.js. Layout lives in styles.css, behaviour in app.js.
  Photos and recordings are "asset slots": tap any empty slot to load a local file. Uploads are
  stored in this browser (IndexedDB) and survive reloads and airplane mode. A slot pre-filled
  from live-data.js (a real photo/audio URL) renders filled and read-only.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loci</title>
<meta name="description" content="Loci parent app — conversation starters from your child's lens routes.">
<meta name="theme-color" content="#F07424">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Loci">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Coming+Soon&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <main id="stage"></main>
  <div id="overlay"></div>
  <nav id="nav"></nav>
  <div id="sheet-root"></div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
</div>
<input type="file" id="file-input" hidden>
<audio id="player" preload="metadata"></audio>
<script src="data.js"></script>
<script src="live-data.js"></script>
<script src="app.js"></script>
</body>
</html>
